# ERGOEXPRESS FINANCE - Docker Compose
version: '3.8'

services:
  # API Backend
  api:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://ergoexpress:password@postgres:5432/ergoexpress_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your_super_secret_jwt_key_here
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - ergoexpress-network
    restart: unless-stopped

  # Base de Datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=ergoexpress_db
      - POSTGRES_USER=ergoexpress
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - ergoexpress-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ergoexpress -d ergoexpress_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ergoexpress-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # pgAdmin (Interfaz gráfica para PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@ergoexpress.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - ergoexpress-network
    restart: unless-stopped

  # Redis Commander (Interfaz gráfica para Redis)
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - ergoexpress-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  ergoexpress-network:
    driver: bridge