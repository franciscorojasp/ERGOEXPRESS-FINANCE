<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ERGOEXPRESS CRM — Iniciar Sesión" />
  <meta name="theme-color" content="#0d7377" />
  <title>ERGOEXPRESS CRM — Iniciar Sesión</title>

  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css?v=3.1.0" />
  <link rel="stylesheet" href="css/components.css?v=3.1.0" />

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-base);
      overflow: hidden;
      padding: 20px;
    }

    /* Animated mesh background */
    .login-bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 40%, rgba(13,115,119,.25) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 60%, rgba(13,115,119,.15) 0%, transparent 60%),
        var(--bg-base);
    }
    .login-bg::before {
      content: '';
      position: absolute; inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%230d7377' fill-opacity='0.04'%3E%3Ccircle cx='30' cy='30' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      animation: bgMove 20s ease infinite alternate;
    }
    @keyframes bgMove {
      from { transform: translate(0,0); }
      to   { transform: translate(20px, 20px); }
    }

    .login-card {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      background: rgba(15, 24, 38, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.4);
      animation: slideUp .7s var(--spring) both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-logo {
      display: flex; flex-direction: column; align-items: center;
      margin-bottom: 28px; gap: 10px;
    }
    .login-logo img {
      width: 72px; height: 72px; object-fit: contain;
      border-radius: 16px;
      background: var(--bg-surface);
      padding: 8px;
      box-shadow: 0 4px 20px rgba(13,115,119,.3);
    }
    .login-logo-name {
      font-size: 20px; font-weight: 800;
      letter-spacing: .5px;
      background: linear-gradient(135deg, var(--primary-light), #fff);
      background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .login-logo-sub {
      font-size: 11px; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 1px;
      margin-top: -6px;
    }

    .login-title {
      font-size: 15px; font-weight: 600;
      color: var(--text-primary); margin-bottom: 20px;
      text-align: center;
    }

    .login-btn {
      width: 100%;
      background: var(--primary);
      color: #fff; border: none;
      border-radius: var(--r-md);
      font-size: 15px; font-weight: 600;
      padding: 13px;
      cursor: pointer;
      transition: all .2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 8px;
    }
    .login-btn:hover:not(:disabled) { background: var(--primary-dark); transform: translateY(-1px); }
    .login-btn:disabled { opacity: .6; cursor: not-allowed; }

    .login-divider {
      display: flex; align-items: center; gap: 10px;
      margin: 20px 0 16px;
      color: var(--text-muted); font-size: 12px;
    }
    .login-divider::before, .login-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    .setup-link {
      text-align: center; margin-top: 16px;
    }
    .setup-link button {
      background: none; border: none;
      color: var(--primary-light); font-size: 13px;
      cursor: pointer; text-decoration: underline;
    }

    .tab-switch {
      display: flex; gap: 4px;
      background: var(--bg-surface);
      border-radius: var(--r-md);
      padding: 4px;
      margin-bottom: 20px;
    }
    .tab-switch button {
      flex: 1; padding: 8px 12px;
      border: none; border-radius: calc(var(--r-md) - 2px);
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      transition: all .2s;
      background: none; color: var(--text-muted);
    }
    .tab-switch button.active {
      background: var(--bg-card); color: var(--text-primary);
      box-shadow: 0 1px 4px rgba(0,0,0,.2);
    }

    .login-error {
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.3);
      color: var(--error); font-size: 13px;
      border-radius: var(--r-sm); padding: 10px 12px;
      margin-top: 8px; display: none;
    }
    .login-error.show { display: block; animation: fadeIn .3s ease; }

    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 44px; }
    .toggle-pass {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--text-muted);
    }
    .toggle-pass:hover { color: var(--text-primary); }
  </style>
</head>
<body>
  <div class="login-bg"></div>

  <!-- ── Login Card ──────────────────────────────────────────────────────── -->
  <div class="login-card" id="login-card">

    <!-- Logo -->
    <div class="login-logo">
      <img src="assets/logo.png" alt="ERGOEXPRESS" onerror="this.style.opacity='.4'" />
      <div class="login-logo-name">ERGOEXPRESS</div>
      <div class="login-logo-sub">CRM v1.0 · Sistema de Gestión</div>
    </div>

    <!-- Tab switch: Login / Primer acceso -->
    <div class="tab-switch" id="tab-switch">
      <button class="active" id="tab-login" onclick="showTab('login')">Iniciar sesión</button>
      <button id="tab-setup" onclick="showTab('setup')">Solicitar Ingreso</button>
    </div>

    <!-- ── LOGIN FORM ──────────────────────────────────────────────────── -->
    <div id="panel-login">
      <p class="login-title" style="font-size:13px; color:var(--text-muted); text-align:left; margin-bottom:12px;">
        Ingresa con el correo y contraseña que te asignó el administrador.
      </p>
      <div class="form-group" style="margin-bottom:12px;">
        <label class="form-label">Correo electrónico</label>
        <input class="form-input" type="email" id="login-email" placeholder="usuario@correo.com"
               autocomplete="email" onkeydown="if(event.key==='Enter') loginSubmit()" />
      </div>
      <div class="form-group" style="margin-bottom:4px;">
        <label class="form-label">Contraseña</label>
        <div class="password-wrap">
          <input class="form-input" type="password" id="login-pass" placeholder="••••••••"
                 autocomplete="current-password" onkeydown="if(event.key==='Enter') loginSubmit()" />
          <button class="toggle-pass" type="button" onclick="togglePass('login-pass')" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="login-error" id="login-error"></div>
      <button class="login-btn" id="login-btn" onclick="loginSubmit()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Entrar al CRM
      </button>
    </div>

    <!-- ── SETUP FORM (primer administrador) ──────────────────────────── -->
    <div id="panel-setup" style="display:none;">
      <p class="login-title" style="font-size:13px; color:var(--text-muted); text-align:left; margin-bottom:12px;">
        Configura la cuenta de administrador. Solo se puede hacer una vez.
      </p>
      <div id="setup-status" style="display:none;" class="login-error" style="background:rgba(13,115,119,.15); color:var(--primary-light); border-color:var(--primary);"></div>
      <div class="form-group" style="margin-bottom:12px;">
        <label class="form-label">Tu nombre completo</label>
        <input class="form-input" id="setup-name" placeholder="Nombre y Apellido"
               onkeydown="if(event.key==='Enter') setupSubmit()" />
      </div>
      <div class="form-group" style="margin-bottom:12px;">
        <label class="form-label">Correo electrónico</label>
        <input class="form-input" type="email" id="setup-email" placeholder="admin@correo.com"
               onkeydown="if(event.key==='Enter') setupSubmit()" />
      </div>
      <div class="form-group" style="margin-bottom:4px;">
        <label class="form-label">Contraseña</label>
        <div class="password-wrap">
          <input class="form-input" type="password" id="setup-pass" placeholder="Mínimo 6 caracteres"
                 onkeydown="if(event.key==='Enter') setupSubmit()" />
          <button class="toggle-pass" type="button" onclick="togglePass('setup-pass')" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="login-error" id="setup-error"></div>
      <button class="login-btn" id="setup-btn" onclick="setupSubmit()"
              style="background:linear-gradient(135deg,#0d7377,#085f63);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        Solicitar Acceso
      </button>
    </div>

    <!-- Nota -->
    <p style="margin-top:18px; font-size:11px; color:var(--text-muted); text-align:center; line-height:1.5;">
      Los datos se almacenan en tu Google Sheet.<br/>
      <span style="color:var(--primary-light);">🔒 Conexión cifrada · Sin servidor externo</span>
    </p>
  </div>

  <!-- Scripts -->
  <script src="config.js?v=3.1.0"></script>
  <script src="js/api.js?v=3.1.0"></script>
  <script src="js/auth.js?v=3.1.0"></script>

  <script>
    let _activeTab = 'login';

    function showTab(tab) {
      _activeTab = tab;
      document.getElementById('panel-login').style.display  = tab === 'login' ? 'block' : 'none';
      document.getElementById('panel-setup').style.display  = tab === 'setup' ? 'block' : 'none';
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-setup').classList.toggle('active', tab === 'setup');
    }

    function togglePass(id) {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    }

    function setError(id, msg) {
      const el = document.getElementById(id);
      if (!msg) { el.classList.remove('show'); return; }
      el.textContent = msg;
      el.classList.add('show');
    }

    // ── Login ──────────────────────────────────────────────────────────────
    async function loginSubmit() {
      const email = document.getElementById('login-email').value.trim();
      const pass  = document.getElementById('login-pass').value;
      setError('login-error', '');

      if (!email || !pass) {
        setError('login-error', 'Por favor completa email y contraseña.');
        return;
      }

      // Verificar que la URL del Apps Script esté configurada
      if (!CONFIG.APPS_SCRIPT_URL || CONFIG.APPS_SCRIPT_URL.includes('PEGA_AQUÍ')) {
        setError('login-error', '⚠️ Primero configura la URL del Apps Script en config.js');
        return;
      }

      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" style="width:18px;height:18px;border-width:2px;"></span> Verificando…';

      try {
        const res = await Auth.login(email, pass);
        if (res.success) {
          window.location.href = 'index.html';
        } else {
          setError('login-error', res.error || 'Error de autenticación');
          btn.disabled = false;
          btn.innerHTML = 'Entrar al CRM';
        }
      } catch(e) {
        setError('login-error', e.message);
        btn.disabled = false;
        btn.innerHTML = 'Entrar al CRM';
      }
    }

    // ── Setup (crear admin) ────────────────────────────────────────────────
    async function setupSubmit() {
      const name  = document.getElementById('setup-name').value.trim();
      const email = document.getElementById('setup-email').value.trim();
      const pass  = document.getElementById('setup-pass').value;
      setError('setup-error', '');

      if (!name || !email || !pass) {
        setError('setup-error', 'Completa todos los campos.');
        return;
      }
      if (pass.length < 6) {
        setError('setup-error', 'La contraseña debe tener al menos 6 caracteres.');
        return;
      }
      if (!CONFIG.APPS_SCRIPT_URL || CONFIG.APPS_SCRIPT_URL.includes('PEGA_AQUÍ')) {
        setError('setup-error', '⚠️ Configura la URL del Apps Script en config.js primero.');
        return;
      }

      const btn = document.getElementById('setup-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" style="width:18px;height:18px;border-width:2px;"></span> Configurando…';

      try {
        // 1. Crear hojas
        await API.call('SETUP', {});

        // 2. Crear admin
        const res = await API.call('CREATE_ADMIN', { email, name, password: pass });

        if (res.success) {
          // Guardar sesión
          localStorage.setItem('crm_token',     res.token);
          localStorage.setItem('crm_user',      JSON.stringify(res.user));
          localStorage.setItem('crm_user_role', 'admin');
          window.location.href = 'index.html';
        } else {
          setError('setup-error', res.error || 'Error al crear administrador');
          btn.disabled = false;
          btn.innerHTML = 'Configurar administrador';
        }
      } catch(e) {
        setError('setup-error', e.message);
        btn.disabled = false;
        btn.innerHTML = 'Configurar administrador';
      }
    }

    // Auto-check: ¿ya existe sesión válida?
    (async () => {
      Auth.init();
      if (Auth.isAuthenticated()) {
        try {
          const ok = await Auth.validate();
          if (ok) { window.location.href = 'index.html'; return; }
        } catch(e) {}
      }
      // Enfocar el primer campo
      setTimeout(() => {
        const el = document.getElementById('login-email');
        if (el) el.focus();
      }, 200);
    })();
  </script>
</body>
</html>
